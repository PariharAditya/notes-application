# Docker-specific configuration for notes-application
spring.application.name=NotesApplication
server.port=8080

# Eureka configuration with explicit URL formatting
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

# Registration settings - ensure we register with the correct address
eureka.instance.preferIpAddress=true
eureka.instance.hostname=notes-application
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Configuration
spring.kafka.bootstrap-servers=broker:29092

# JasperReports Configuration
jasper.reports.compiler.class.path=/app/jasperreports
net.sf.jasperreports.compiler.temp.dir=/tmp
net.sf.jasperreports.compiler.xml.validation=false
net.sf.jasperreports.compiler.classpath=${jasper.reports.compiler.class.path}

# Logging configuration
logging.level.net.sf.jasperreports=DEBUG
logging.level.org.note.notesapplication.Service.ReportService=DEBUG
logging.level.com.netflix.discovery=DEBUG
logging.level.com.netflix.eureka=DEBUG
logging.level.org.springframework.cloud.netflix=DEBUG