spring.application.name=NotificationService
server.port=8081

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:5050/realms/notes-application
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:5050/realms/notes-application/protocol/openid-connect/certs